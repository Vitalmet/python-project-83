name: Lint, Test and SonarQube

on:
  - push
  - pull_request

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install uv
          make install

      - name: Run linter
        run: |
          make lint

      - name: Run tests
        run: |
          make test

  sonarqube:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install uv
          make install

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ --cov=page_analyzer --cov-report=xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
              -Dsonar.host.url=https://sonarcloud.io
              -Dsonar.projectKey=Vitalmet_python-project-83
              -Dsonar.organization=vitalmet
              -Dsonar.sources=page_analyzer
              -Dsonar.tests=tests
              -Dsonar.python.coverage.reportPaths=coverage.xml
              -Dsonar.exclusions=**/__pycache__/**,hexlet_code/**,templates/**
