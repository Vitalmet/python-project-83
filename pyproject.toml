[project]
name = "hexlet-code"
version = "0.1.0"
description = "Web application for testing"
requires-python = ">=3.12"
dependencies = [
   "bootstrap-flask>=2.5.0",
   "flask>=3.0.0",
   "flask-wtf>=1.2.0",
   "flask-limiter>=3.5.0",
   "gunicorn>=21.0.0",
   "python-dotenv>=1.2.2",
   "psycopg2-binary>=2.9.0",
   "validators>=0.28.0",
   "requests>=2.31.0",
   "beautifulsoup4>=4.12.0",
]


[build-system]
requires = ["flit-core<4"]
build-backend = "flit_core.buildapi"


[dependency-groups]
dev = [
   "ruff>=0.12.0",
   "pytest>=8.0.0",
   "pytest-flask>=1.3.0",
   "pytest-cov>=5.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["page_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
